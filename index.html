<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global.css" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <!-- Mapbox GL JS CSS -->
     <link
        href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
        rel="stylesheet" 
    />
    <link rel="stylesheet" href="map.css" />
    <script src="map.js" type="module"></script>
    <title>Bikewatching</title>
</head>
<body>
    <header>
        <h1>🚴🏼‍♀️ Bikewatching in Boston</h1>
        <label>
            Filter by time:
            <input type="range" id="time-slider" min="-1" max="1439" value="-1"/>
            <time id="selected-time"></time>
            <em id="any-time">(any time)</em>
        </label>
    </header>
    <p>This map visualizes "Bluebikes" travel in Boston/Cambridge area over the course of a day.</p>
    <div id="map">
        <svg></svg>
    </div>
    <div class="legend">
        <span>Legend:</span>
        <div style="--departure-ratio: 1">
            <span class="swatch"></span>
            More departures
        </div>
        <div style="--departure-ratio: 0.5">
            <span class="swatch"></span>
            Balanced
        </div>
        <div style="--departure-ratio: 0">
            <span class="swatch"></span>
            More arrivals
        </div>
    </div>
</body>
</html>
